<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Builder - Economics Education Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #canvas {
            border: 2px solid #333;
            max-width: 100%;
            height: auto;
        }
        .loading {
            color: white;
            font-size: 24px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .info {
            color: #ccc;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="1200" height="800"></canvas>
        <div class="info">
            <h2>City Builder - Economics Education</h2>
            <p>Use WASD or Arrow Keys to move, E to interact, G to toggle grid</p>
        </div>
    </div>
    
    <script type="module">
        import { loadPyodide } from 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
        
        async function main() {
            let pyodide = await loadPyodide({
                indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
            });
            
            await pyodide.loadPackage(['pygame-ce']);
            
            pyodide.runPython(`
                import sys
                sys.path.append('.')
            `);
        }
        
        main();
    </script>
</body>
</html>
